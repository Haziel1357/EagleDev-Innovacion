[project]
name = "revalora-backend"
version = "0.1.0"
description = "Aplicación principal de REVALORA: usuarios, empresas, materiales, necesidades, coincidencias y transacciones."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Framework web y servidor
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
    # Configuración y validación
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    # Base de datos
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # Seguridad
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.10",
    # Cliente HTTP del servicio de IA
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
# Es una aplicación, no una librería: uv no la instala como paquete.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# TypeVar/Generic se mantiene por legibilidad; la longitud de línea la controla `ruff format`.
ignore = ["UP046", "UP047", "E501"]
